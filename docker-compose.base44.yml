services:
  web:
    image: node:22-slim
    working_dir: /app
    restart: on-failure
    env_file:
      - ./.env.base44-defaults   # placeholders + public URL — app boots without credentials
      - /run/base44/app.env      # platform secrets — LAST, always wins
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3000:5173"
    command: ["sh", "-ec", "npm install && exec npx vite --host 0.0.0.0 --port 5173"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5173/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
